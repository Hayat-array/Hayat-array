<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD6A5"/>
      <stop offset="100%" stop-color="#E8B482"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#glowGrad)" stroke-width="4" filter="url(#neonGlow)" opacity="0.8"/>

  <!-- Halo / Cyber Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#00D4FF" stroke-width="2" stroke-dasharray="10 15" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Hoodie / Shoulders -->
  <path d="M 80 380 Q 200 290 320 380 Z" fill="url(#hoodieGrad)"/>
  <path d="M 160 300 L 200 360 L 240 300 Z" fill="#312E81"/>
  <!-- T-shirt collar -->
  <path d="M 175 300 Q 200 320 225 300 Z" fill="#FACC15"/>

  <!-- Neck -->
  <rect x="175" y="240" width="50" height="70" rx="10" fill="url(#skinGrad)"/>
  <path d="M 175 270 Q 200 295 225 270 Z" fill="#D99B6A" opacity="0.5"/>

  <!-- Face Head Oval -->
  <path d="M 130 180 C 130 110, 270 110, 270 180 C 270 250, 230 270, 200 270 C 170 270, 130 250, 130 180 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <circle cx="128" cy="185" r="16" fill="url(#skinGrad)"/>
  <circle cx="272" cy="185" r="16" fill="url(#skinGrad)"/>

  <!-- Hair (Stylish Anime Style) -->
  <path d="M 125 170 C 120 100, 160 70, 200 70 C 250 70, 280 100, 275 170 C 260 120, 230 95, 200 95 C 170 95, 140 120, 125 170 Z" fill="url(#hairGrad)"/>
  <!-- Hair Strands Front -->
  <path d="M 135 130 Q 170 160 175 120 Q 200 160 215 115 Q 235 150 265 140 C 240 100, 160 90, 135 130 Z" fill="url(#hairGrad)"/>

  <!-- Smart Glasses -->
  <rect x="145" y="160" width="45" height="30" rx="8" fill="none" stroke="#00D4FF" stroke-width="3" filter="url(#neonGlow)"/>
  <rect x="210" y="160" width="45" height="30" rx="8" fill="none" stroke="#00D4FF" stroke-width="3" filter="url(#neonGlow)"/>
  <line x1="190" y1="172" x2="210" y2="172" stroke="#00D4FF" stroke-width="3"/>
  <line x1="128" y1="172" x2="145" y2="172" stroke="#00D4FF" stroke-width="2"/>
  <line x1="255" y1="172" x2="272" y2="172" stroke="#00D4FF" stroke-width="2"/>

  <!-- Eyes behind glasses -->
  <circle cx="167" cy="175" r="5" fill="#0F172A"/>
  <circle cx="233" cy="175" r="5" fill="#0F172A"/>
  <circle cx="169" cy="173" r="2" fill="#FFFFFF"/>
  <circle cx="235" cy="173" r="2" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M 148 152 Q 167 146 186 152" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 214 152 Q 233 146 252 152" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 200 180 L 196 198 L 202 200" fill="none" stroke="#D99B6A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Confident Smile -->
  <path d="M 180 222 Q 200 235 220 222" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Headset / Cyber Mic -->
  <path d="M 125 185 Q 110 240 180 248" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <circle cx="180" cy="248" r="5" fill="#EC4899"/>

  <!-- Floating Sparkles -->
  <path d="M 70 120 L 75 130 L 85 135 L 75 140 L 70 150 L 65 140 L 55 135 L 65 130 Z" fill="#00D4FF" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 320 100 L 324 108 L 332 112 L 324 116 L 320 124 L 316 116 L 308 112 L 316 108 Z" fill="#EC4899" opacity="0.8">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
  </path>
</svg>
