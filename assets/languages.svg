<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%">
  <defs>
    <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="pyBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3572A5"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>

    <linearGradient id="tsBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="cppBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F34B7D"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="sqlBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E38C00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="langsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-langs {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      font-size: 18px;
      fill: #00D4FF;
      letter-spacing: 1px;
    }

    .lang-lbl {
      font-family: system-ui, -apple-system, 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #E2E8F0;
    }

    .lang-val {
      font-family: system-ui, -apple-system, 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #94A3B8;
    }

    .lang-bg-rect {
      fill: #1E293B;
    }

    @media (prefers-color-scheme: light) {
      .title-langs { fill: #4F46E5; }
      .lang-lbl { fill: #1E293B; }
      .lang-val { fill: #475569; }
      .lang-bg-rect { fill: #E2E8F0; }
    }
  </style>

  <!-- Frame -->
  <rect width="540" height="210" rx="16" fill="url(#langsBg)" stroke="#00D4FF" stroke-width="2" filter="url(#langsGlow)"/>

  <!-- Title -->
  <text x="24" y="36" class="title-langs">📊 MOST USED LANGUAGES</text>
  <line x1="24" y1="46" x2="516" y2="46" stroke="#334155" stroke-width="1"/>

  <!-- Bar 1: Python -->
  <g transform="translate(24, 65)">
    <text x="0" y="0" class="lang-lbl">Python (AI / ML / Data Science)</text>
    <text x="492" y="0" class="lang-val" text-anchor="end">42.5%</text>
    <rect x="0" y="8" width="492" height="10" rx="5" class="lang-bg-rect"/>
    <rect x="0" y="8" width="209" height="10" rx="5" fill="url(#pyBar)"/>
  </g>

  <!-- Bar 2: JavaScript / TypeScript -->
  <g transform="translate(24, 100)">
    <text x="0" y="0" class="lang-lbl">JavaScript / TypeScript / React</text>
    <text x="492" y="0" class="lang-val" text-anchor="end">28.4%</text>
    <rect x="0" y="8" width="492" height="10" rx="5" class="lang-bg-rect"/>
    <rect x="0" y="8" width="140" height="10" rx="5" fill="url(#tsBar)"/>
  </g>

  <!-- Bar 3: C++ & C -->
  <g transform="translate(24, 135)">
    <text x="0" y="0" class="lang-lbl">C++ / C (DSA &amp; Problem Solving)</text>
    <text x="492" y="0" class="lang-val" text-anchor="end">16.8%</text>
    <rect x="0" y="8" width="492" height="10" rx="5" class="lang-bg-rect"/>
    <rect x="0" y="8" width="83" height="10" rx="5" fill="url(#cppBar)"/>
  </g>

  <!-- Bar 4: SQL & PHP -->
  <g transform="translate(24, 170)">
    <text x="0" y="0" class="lang-lbl">SQL &amp; Database / PHP</text>
    <text x="492" y="0" class="lang-val" text-anchor="end">12.3%</text>
    <rect x="0" y="8" width="492" height="10" rx="5" class="lang-bg-rect"/>
    <rect x="0" y="8" width="60" height="10" rx="5" fill="url(#sqlBar)"/>
  </g>
</svg>
