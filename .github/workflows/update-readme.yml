name: Update Profile Stats & Activity

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Refresh Cache Timestamp in README
        run: |
          TIMESTAMP=$(date +%s)
          echo "Updating cache-busting timestamp to $TIMESTAMP"
          sed -i "s/?v=[0-9]*/?v=$TIMESTAMP/g" README.md

      - name: Commit Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "⚡ Auto-bump README asset cache-busting query [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
